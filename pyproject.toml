[project]
name = "anki-wizard"
version = "0.1.0"
description = "A harness for Claude agents to create and manage Anki decks"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "pypdf>=4.0",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_wizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
